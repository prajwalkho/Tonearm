<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A dark, responsive music player for songs directed by Prajwal Khot using AI technology.">
<meta name="theme-color" content="#0c0e13">
<title>Tonearm – Music Player</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0c0e13;--s1:#141822;--s2:#1d2230;--s3:#283042;--tx:#eef0f6;--mu:#8b93a8;--ac:#9b8cff;--like:#ff6b8b;--r:14px;font-family:'Bricolage Grotesque',system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0}
body{height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}
#app{height:100%;display:grid;grid-template-columns:260px 1fr;grid-template-rows:1fr auto;grid-template-areas:"nav main" "player player";gap:8px;padding:8px}
nav{grid-area:nav;background:var(--s1);border-radius:var(--r);padding:20px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;padding:0 12px 16px;display:flex;gap:10px;align-items:center}
.logo i{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--ac),#5ef0c4,var(--ac));display:grid;place-items:center}
.logo i:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--bg)}
.nl{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:10px;color:var(--mu);font-weight:600;width:100%;text-align:left;transition:.15s}
.nl:hover,.nl.on{color:var(--tx);background:var(--s2)}
.pls{margin-top:14px;border-top:1px solid var(--s2);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.pls h3{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu);padding:0 12px 6px;font-weight:600}
.pls h3 button{color:var(--mu);padding:4px;border-radius:8px}.pls h3 button:hover{background:var(--s2);color:var(--tx)}
main{grid-area:main;background:var(--s1);border-radius:var(--r);overflow:auto;padding:28px 32px 40px;scroll-behavior:smooth}
h1{font-size:clamp(28px,4vw,44px);letter-spacing:-.03em;font-weight:800}
h2{font-size:22px;letter-spacing:-.02em;margin:34px 0 14px}
.sub{color:var(--mu);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{background:var(--s2);border-radius:var(--r);padding:12px;text-align:left;transition:.2s;position:relative;display:block}
.card:hover{background:var(--s3);transform:translateY(-3px)}
.card b{display:block;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--mu);font-size:13px}
.card .pb{position:absolute;right:20px;top:calc(100% - 78px);opacity:0;transform:translateY(8px);transition:.2s}
.card:hover .pb,.card:focus-within .pb{opacity:1;transform:none}
.pb{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#0c0e13;display:grid;place-items:center;box-shadow:0 6px 16px #0008}
.pb:hover{transform:scale(1.07)}
.cv{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:2.4em;color:#fff9;overflow:hidden}
.song-cover{--art-a:#293352;--art-b:#473360;--art-c:#151b2c;position:relative;isolation:isolate;display:block!important;color:#fff;background:linear-gradient(145deg,var(--art-a),var(--art-b) 58%,var(--art-c))!important;background-size:150% 150%!important;transition:filter .35s,transform .35s}
.song-cover:before,.song-cover:after{content:"";position:absolute;inset:0;pointer-events:none}
.song-cover:before{z-index:-1;background:radial-gradient(circle at 74% 28%,var(--art-a) 0,transparent 43%),radial-gradient(ellipse at 22% 88%,var(--art-b) 0,transparent 52%);opacity:.9}
.song-cover:after{z-index:1;background:repeating-linear-gradient(135deg,#ffffff08 0 1px,transparent 1px 9px);mix-blend-mode:screen;opacity:.55}
.song-cover>span{z-index:2}
.theme-krishna{--art-a:#16b8b1;--art-b:#2255a5;--art-c:#101938}
.theme-river{--art-a:#50d4cd;--art-b:#3468a6;--art-c:#16283d}
.theme-ram{--art-a:#ffb44e;--art-b:#df613d;--art-c:#491f42}
.theme-hanuman{--art-a:#ff7047;--art-b:#b83543;--art-c:#361c3c}
.theme-ganesha{--art-a:#f4a52e;--art-b:#cf4d74;--art-c:#412c68}
.theme-moon{--art-a:#c27ce8;--art-b:#51489a;--art-c:#171a3b}
.theme-stars{--art-a:#8a78ff;--art-b:#405fc5;--art-c:#141b3a}
.theme-night{--art-a:#7b69c9;--art-b:#293965;--art-c:#10182c}
.theme-rain{--art-a:#5fc6c8;--art-b:#3b718c;--art-c:#172e43}
.theme-love{--art-a:#ff83aa;--art-b:#b54a8a;--art-c:#35224d}
.theme-dawn{--art-a:#ffc36e;--art-b:#ed7658;--art-c:#54305a}
.theme-temple{--art-a:#96c66b;--art-b:#3a9b85;--art-c:#153c48}
.art-glow{position:absolute;z-index:0;width:76%;aspect-ratio:1;right:-21%;top:-24%;border-radius:50%;background:radial-gradient(circle,#ffffff75 0, #ffffff18 36%,transparent 70%);opacity:.46;transition:opacity .5s,transform .8s}
.art-motif{position:absolute;top:8%;right:10%;font-size:.92em;line-height:1;color:#fff9;text-shadow:0 5px 20px #080d2e66;transform:rotate(var(--art-turn,-4deg));transition:transform .6s,opacity .4s;opacity:.84}
.art-initial{position:absolute;left:11%;bottom:7%;font-size:.98em;line-height:1;color:#fff;letter-spacing:-.08em;text-shadow:0 4px 24px #060b2766}
.art-bars{position:absolute;right:11%;bottom:11%;height:24%;display:flex;align-items:flex-end;gap:4%;width:27%;opacity:.82}
.art-bars i{display:block;flex:1;height:var(--bar-height,55%);min-width:2px;border-radius:4px;background:linear-gradient(0deg,#fff7,var(--art-a));box-shadow:0 0 8px #ffffff40;transform-origin:bottom}
.song-cover.is-playing{animation:artDrift 9s ease-in-out infinite alternate}
.song-cover.is-playing .art-glow,.song-cover:hover .art-glow{opacity:.82;transform:scale(1.13)}
.song-cover.is-playing .art-bars i{animation:artWave 1.05s ease-in-out infinite alternate}
.song-cover.is-playing .art-bars i:nth-child(2n){animation-delay:-.45s}.song-cover.is-playing .art-bars i:nth-child(3n){animation-delay:-.72s}
.song-cover:hover .art-motif{transform:rotate(5deg) scale(1.08);opacity:1}
.song-cover:hover{filter:saturate(1.16) brightness(1.05)}
@keyframes artWave{0%{transform:scaleY(.38)}100%{transform:scaleY(1)}}
@keyframes artDrift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
.round .cv{border-radius:50%}.round{text-align:center}
.hero{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;padding:8px 0 10px}
.hero .cv{width:clamp(130px,22vw,220px);font-size:5rem;box-shadow:0 20px 50px #0009;flex:none}
.hero.rd .cv{border-radius:50%}
.feat{display:flex;gap:24px;align-items:center;padding:22px;border-radius:20px;background:linear-gradient(120deg,var(--s3),var(--s2));margin:18px 0}
.feat .cv{width:150px;flex:none;font-size:3rem}
.eq{display:flex;gap:3px;align-items:flex-end;height:16px}.eq i{width:3px;background:var(--ac);height:100%;animation:eq .8s infinite ease-in-out;transform-origin:bottom}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{50%{transform:scaleY(.3)}}
.row{display:grid;grid-template-columns:36px minmax(0,2fr) minmax(0,1.2fr) auto 44px;gap:12px;align-items:center;padding:6px 10px;border-radius:10px;transition:.15s}
.row:hover{background:var(--s2)}.row.cur .t{color:var(--ac)}
.row .n{color:var(--mu);text-align:center;font-size:14px}
.row .tt{display:flex;gap:12px;align-items:center;min-width:0;text-align:left}
.row .cv{width:40px;font-size:14px;border-radius:6px;flex:none}
.row .song-cover .art-motif{font-size:.68em;right:8%;top:7%}.row .song-cover .art-initial{left:8%;bottom:8%;font-size:.92em}.row .song-cover .art-bars{gap:3%;width:29%;right:8%;bottom:8%}
.row.is-playing .song-cover .art-bars i{animation:artWave 1.05s ease-in-out infinite alternate}.row.is-playing .song-cover .art-bars i:nth-child(2n){animation-delay:-.45s}.row.is-playing .song-cover .art-bars i:nth-child(3n){animation-delay:-.72s}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .a{color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .al{color:var(--mu);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ac{display:flex;gap:2px;opacity:.55}.row:hover .ac{opacity:1}
.ib{padding:7px;border-radius:50%;color:var(--mu);transition:.15s;display:grid;place-items:center}
.ib:hover{color:var(--tx);background:var(--s3)}.ib.on{color:var(--ac)}.ib.lk.on{color:var(--like)}.ib.lk.on svg{fill:var(--like)}
.tm{color:var(--mu);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:10px;align-items:center;margin:18px 0}
.big{width:56px;height:56px}
.empty{text-align:center;padding:60px 20px;color:var(--mu)}.empty h3{color:var(--tx);font-size:20px;margin-bottom:6px}
.btn{background:var(--ac);color:#0c0e13;font-weight:700;padding:10px 20px;border-radius:30px;margin-top:16px;display:inline-block}
.btn.g{background:var(--s3);color:var(--tx)}
.sk{background:linear-gradient(90deg,var(--s2),var(--s3),var(--s2));background-size:200%;animation:sh 1.2s infinite;border-radius:12px;height:190px}
@keyframes sh{to{background-position:-200% 0}}
.srch{width:100%;max-width:460px;background:var(--s2);border:2px solid transparent;border-radius:30px;padding:12px 20px;margin:14px 0}
.srch:focus{outline:0;border-color:var(--ac)}
#player{grid-area:player;background:var(--s1);border-radius:var(--r);padding:10px 16px;display:grid;grid-template-columns:1fr minmax(320px,2fr) 1fr;gap:16px;align-items:center}
.np{display:flex;gap:12px;align-items:center;min-width:0}.np .cv{width:54px;flex:none;font-size:18px;border-radius:8px}
.np .song-cover .art-motif{font-size:.72em}.np .song-cover .art-initial{font-size:.82em}.np .song-cover .art-bars{gap:2%;width:28%}
.np b,.np span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np span{color:var(--mu);font-size:13px}
.ctl{display:flex;flex-direction:column;gap:6px;align-items:center}
.btns{display:flex;gap:10px;align-items:center}
.pp{width:42px;height:42px;border-radius:50%;background:var(--tx);color:var(--bg);display:grid;place-items:center}.pp:hover{transform:scale(1.07)}
.seek{display:flex;gap:10px;align-items:center;width:100%;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--ac) var(--p,0%),var(--s3) var(--p,0%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;opacity:0;transition:.15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
.vol{display:flex;gap:8px;align-items:center;justify-content:flex-end}.vol input{flex:0 1 110px}
dialog{background:var(--s2);color:var(--tx);border:1px solid var(--s3);border-radius:18px;padding:22px;width:min(380px,92vw);margin:auto}
dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}
dialog h3{margin-bottom:12px}dialog .it{display:flex;width:100%;gap:10px;padding:10px;border-radius:10px;text-align:left}dialog .it:hover{background:var(--s3)}
dialog input{width:100%;background:var(--s1);border:1px solid var(--s3);border-radius:10px;padding:10px 12px}
dialog .playlist-type{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--s3);border-radius:11px;margin-top:8px;cursor:pointer}
dialog .playlist-type:has(input:checked){border-color:var(--ac);background:#9b8cff12}
dialog .playlist-type input{width:auto;margin-top:4px;accent-color:var(--ac)}
.membership{display:inline-block!important;width:max-content;padding:1px 6px;border-radius:8px;color:#b9f6dc!important;background:#36ad7830;font-size:11px!important;margin-top:2px}
.membership.temporary{color:#ffe1a6!important;background:#e5a83a30}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:30px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
#bn{display:none}
@media(max-width:1024px){#app{grid-template-columns:76px 1fr}.logo span,.nl span,.pls h3 span,.pls .nl em{display:none}.nl{justify-content:center;padding:12px}.logo{justify-content:center;padding:0 0 16px}.pls h3{justify-content:center}.vol input{display:none}}
@media(max-width:700px){
#app{grid-template-columns:1fr;grid-template-rows:1fr auto auto;grid-template-areas:"main" "player" "bn";gap:6px;padding:6px}
nav{display:none}main{padding:20px 16px 24px}
#bn{grid-area:bn;display:flex;background:var(--s1);border-radius:var(--r);justify-content:space-around;padding:4px}
#bn .nl{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;width:auto;align-items:center}
#player{grid-template-columns:1fr auto;gap:6px 10px;padding:10px 12px}
.ctl{display:contents}.btns{grid-column:2;grid-row:1}.btns .x{display:none}.seek{grid-column:1/-1;grid-row:2}.seek span{display:none}.vol{display:none}
.row{grid-template-columns:minmax(0,1fr) auto 40px}.row .n,.row .al{display:none}.row .ac .ad{display:none}
.feat{flex-direction:column;align-items:flex-start}.hero{align-items:center}
#toast{bottom:150px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<nav aria-label="Main"></nav>
<main id="main" tabindex="-1"></main>
<footer id="player" aria-label="Player"></footer>
<div id="bn"></div>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="./songs-manifest.js"></script>
<script>
"use strict";
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,s|0);return(s/60|0)+':'+String(s%60).padStart(2,'0')};
const normalizeTimestamp=value=>{if(typeof value!=='string')return null;const date=new Date(value);return Number.isFinite(date.getTime())?date.toISOString():null};
const localDateTime=value=>{const date=typeof value==='string'?new Date(value):new Date(NaN);return Number.isFinite(date.getTime())?new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(date):'Date unavailable'};
const IC={play:'M8 5v14l11-7z',pause:'M6 5h4v14H6zM14 5h4v14h-4z',next:'M6 18l8.5-6L6 6zM16 6h2v12h-2z',prev:'M18 6l-8.5 6 8.5 6zM6 6h2v12H6z',
shuffle:'M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5',repeat:'M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3',
heart:'M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z',home:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',search:'M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5',
lib:'M4 4v16M9 4v16M14 5l6 15',queue:'M3 6h14M3 12h14M3 18h8M18 15v6M15 18h6',plus:'M12 5v14M5 12h14',vol:'M4 9v6h4l5 4V5L8 9zM17 8a5 5 0 010 8',x:'M6 6l12 12M18 6L6 18',clock:'M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2'};
const FILLED=['play','pause','next','prev'];
const ic=n=>`<svg class="${FILLED.includes(n)?'f':''}" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]}"/></svg>`;

/* ---------- Catalog (generated from Songs/; static manifest fallback) ---------- */
const ARTISTS=[{id:0,name:'Prajwal Khot',role:'Director',hue:265}];
const ARTS=ARTISTS;
const ALBUMS=[{id:0,title:'Tonearm',artist:0,hue:265,tracks:[]}];
const SONG_FOLDER='Songs/';
const SUPPORTED_AUDIO=/\.(mp3|m4a|aac|ogg|oga|wav|opus|flac)$/i;
const catalogFromManifest=records=>{const files=new Set(),ids=new Set();return (Array.isArray(records)?records:[]).flatMap(song=>{
 if(!song||typeof song.file!=='string'||song.file!==song.file.split(/[\\/]/).pop()||!SUPPORTED_AUDIO.test(song.file))return[];
 const fileKey=song.file.normalize('NFC').toLocaleLowerCase(),id=Number(song.id);if(files.has(fileKey)||!Number.isSafeInteger(id)||ids.has(id))return[];files.add(fileKey);ids.add(id);
 const title=typeof song.title==='string'&&song.title.trim()?song.title:song.file.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim();
 return[{id,file:song.file,title,artist:0,album:0,url:`${SONG_FOLDER}${encodeURIComponent(song.file)}`,addedAt:normalizeTimestamp(song.addedAt),dur:0}]
})};
let TRACKS=catalogFromManifest(window.TONEARM_SONGS);
let TRACK_BY_ID=new Map(TRACKS.map(track=>[track.id,track]));
let TRACK_BY_FILE=new Map(TRACKS.map(track=>[track.file.normalize('NFC').toLocaleLowerCase(),track]));
ALBUMS[0].tracks=TRACKS.map(track=>track.id);
const T=id=>TRACK_BY_ID.get(Number(id)),AR=i=>ARTS[i],AL=i=>ALBUMS[i];
const grad=h=>`background:linear-gradient(135deg,hsl(${h} 70% 52%),hsl(${(h+50)%360} 60% 22%))`;
const cover=(h,txt,cls='')=>`<div class="cv ${cls}" style="${grad(h)}" aria-hidden="true">${esc(txt)}</div>`;
const SONG_THEMES=[
 {key:'krishna',match:/कृष्ण_कन्हैया|Saanware/i,motif:'❋'},
 {key:'river',match:/यमुना/i,motif:'≈'},
 {key:'ram',match:/अयोध्या|रघुकुल/i,motif:'दीप'},
 {key:'hanuman',match:/केसरी|पवनसुत/i,motif:'ॐ'},
 {key:'ganesha',match:/अगले_बरस|नन्हे_कदमों/i,motif:'ॐ'},
 {key:'rain',match:/Bheege/i,motif:'〰'},
 {key:'stars',match:/Taaron/i,motif:'✦'},
 {key:'night',match:/Raat_/i,motif:'☽'},
 {key:'moon',match:/Chandni|चाँदनी/i,motif:'☾'},
 {key:'love',match:/Bas_Tu|Janam_Janam|Knots_in_the_Sheets|Mita_De/i,motif:'♡'},
 {key:'dawn',match:/Morning_Prayer/i,motif:'☼'},
 {key:'temple',match:/मन_मंदिर/i,motif:'मंत्र'}
];
const songTheme=t=>SONG_THEMES.find(theme=>theme.match.test(t.file))||{key:'krishna',motif:'♫'};
const tCover=t=>{const theme=songTheme(t),playing=P.cur&&P.cur.id===t.id&&P.playing,turn=(t.id%9-4)*3;return `<div class="cv song-cover theme-${theme.key}${playing?' is-playing':''}" style="--art-turn:${turn}deg" aria-hidden="true"><span class="art-glow"></span><span class="art-motif">${esc(theme.motif)}</span><span class="art-initial">${esc(t.title.trim()[0]||'♪')}</span><span class="art-bars"><i style="--bar-height:38%"></i><i style="--bar-height:74%"></i><i style="--bar-height:53%"></i><i style="--bar-height:91%"></i><i style="--bar-height:46%"></i></span></div>`};

/* ---------- Store ---------- */
const CURATED_PLAYLISTS=[
 {id:'p1',name:'Krishna Kanhaiya',files:['कृष्ण_कन्हैया.mp3','यमुना_की_वो_शाम.mp3','यमुना_किनारे_चाँदनी.mp3','Saanware_Ki_Surat.mp3','Janam_Janam_Ki_Dor (1).mp3','Janam_Janam_Ki_Dor.mp3','मन_मंदिर_की_धुन.mp3']},
 {id:'p2',name:'Jai Sri Ram',files:['अयोध्या_की_भोर.mp3','केसरी_नंदन_का_तेज.mp3','रघुकुल_के_दीप.mp3']},

const P={get cur(){return S.qi>=0?T(S.queue[S.qi]):null},playing:false,loading:false,request:0,
 playList(ids,i=0){S.queue=ids.slice();S.qi=i;this.start()},
 async start(){const t=this.cur;if(!t)return;const request=++this.request;this.playing=false;this.loading=true;audio.pause();audio.src=t.url;audio.volume=S.vol;audio.load();syncPlayer();
  try{await audio.play();if(request!==this.request||this.cur!==t)return;this.playing=true;this.loading=false;
   S.recent=[t.id,...S.recent.filter(x=>x!==t.id)].slice(0,20);persist()}catch(e){if(request!==this.request)return;this.playing=false;this.loading=false;toast(e.name==='NotAllowedError'?'Press play to allow audio playback.':'Unable to play this song.')}
  if(request===this.request){syncPlayer();if(/^#\/(recent|queue)/.test(location.hash))route()}},
 toggle(){if(this.playing||this.loading){++this.request;this.loading=false;audio.pause();this.playing=false;syncPlayer();return}
  if(!this.cur){this.playList(TRACKS.map(t=>t.id),0);return}
  const request=++this.request;this.loading=true;audio.volume=S.vol;audio.play().then(()=>{if(request!==this.request)return;this.loading=false;this.playing=true;syncPlayer()}).catch(()=>{if(request!==this.request)return;this.loading=false;this.playing=false;syncPlayer();toast('Unable to play this song.')});syncPlayer()},
 next(auto){if(!S.queue.length)return;const n=S.queue.length;
  if(auto&&S.repeat===2){return this.start()}
  if(S.shuffle&&n>1){let j;do{j=Math.random()*n|0}while(j===S.qi);S.qi=j}
  else if(S.qi+1<n)S.qi++;else if(S.repeat===1||!auto)S.qi=0;else{++this.request;this.loading=false;this.playing=false;audio.pause();audio.currentTime=0;syncPlayer();return}
  this.start()},
 prev(){if(audio.currentTime>3){this.seek(0);return}S.qi=S.qi>0?S.qi-1:S.queue.length-1;this.start()},

 enqueue(id){if(S.qi<0){this.playList([id],0)}else{S.queue.push(id);toast('Added to queue')}}};

 queue(){const n=S.queue.length;if(!n)return `<h1>Queue</h1>`+empty('Your queue is empty','Play a song or use + on a song to add it to the queue.','<a class="btn" href="#/">Browse music</a>');
  return `<h1>Queue</h1><h2>Now playing</h2>${trackRow(S.queue[S.qi],S.qi,'q')}<h2>Next up</h2>${S.queue.slice(S.qi+1).length?S.queue.slice(S.qi+1).map((id,k)=>trackRow(id,S.qi+1+k,'q',{rm:1})).join(''):'<p class="sub">Nothing after this song.</p>'}`},
 nf(){return empty('Page not found','That page doesn’t exist or was removed.','<a class="btn" href="#/">Go home</a>')}};

/* ---------- Router & shell ---------- */
const NAV=[['#/','home','Home'],['#/search','search','Search'],['#/library','lib','Library']];
function shell(){const h=location.hash||'#/';const lk=(x,i,l,e)=>`<a class="nl ${h===x?'on':''}" href="${x}" aria-label="${l}">${ic(i)}<span>${l}</span></a>`;
 $('nav').innerHTML=`<div class="logo"><i></i><span>Tonearm</span></div>${NAV.map(n=>lk(...n)).join('')}${lk('#/liked','heart','Liked songs')}${lk('#/recent','clock','Recently played')}
 <div class="pls"><h3><span>Playlists</span><button data-a="newpl" aria-label="Create playlist">${ic('plus')}</button></h3>${S.playlists.map(p=>`<a class="nl ${h==='#/playlist/'+p.id?'on':''}" href="#/playlist/${p.id}" title="${esc(p.name)}"><span style="display:contents">${ic('queue')}</span><span>${esc(p.name)}</span></a>`).join('')}</div>`;
 $('#bn').innerHTML=[...NAV,['#/queue','queue','Queue']].map(n=>lk(...n)).join('')}
let rt=0;
function route(quiet){clearTimeout(rt);const m=$('#main'),h=location.hash||'#/',[,p,arg]=h.split('/'),keep=m.scrollTop,searchQuery=p==='search'?($('#q')?.value||''):'';shell();
 const render=()=>{try{const fn=V[p||'home'];m.innerHTML=fn&&p!=='results'&&p!=='nf'?fn(p==='search'?searchQuery:decodeURIComponent(arg||'')) :V.nf();
   const q=$('#q');if(q){q.oninput=()=>{$('#res').innerHTML=V.results(q.value)};if(!quiet)q.focus()}}
  catch(e){console.error(e);m.innerHTML=empty('Something went wrong','This page failed to load.','<a class="btn" href="#/">Back to home</a>')}
  m.scrollTop=quiet?keep:0;syncRows()};
 if(quiet)return render();m.innerHTML=`<div class="sk" style="height:48px;width:40%;margin-bottom:24px"></div><div class="grid">${'<div class="sk"></div>'.repeat(8)}</div>`;rt=setTimeout(render,220)}
function syncRows(){document.querySelectorAll('.row').forEach(r=>r.classList.toggle('cur',+r.dataset.id===(P.cur&&P.cur.id)))}
addEventListener('hashchange',()=>route());

/* ---------- Dialogs ---------- */
const dlg=$('#dlg');
const openDlg=h=>{dlg.innerHTML=h;if(!dlg.open)dlg.showModal()};
function addMenu(id){const t=T(id);openDlg(`<h3>Add “${esc(t.title)}”</h3><button class="it" data-a="enq" data-id="${id}">${ic('queue')} Add to queue</button>
 ${S.playlists.filter(p=>p.id!=='popular').map(p=>`<button class="it" data-a="topl" data-pl="${p.id}" data-id="${id}">${ic('plus')} ${esc(p.name)} ${playlistTracks(p).includes(id)?`<span class="sub">(${(S.temporaryAdds[p.id]||[]).includes(id)?'temporary':'permanent'})</span>`:''}</button>`).join('')}
 <button class="it" data-a="newpl" data-id="${id}">${ic('plus')} New playlist…</button>`)}
function addSongOptions(playlist,id){const t=T(id);if(!t)return toast('This song is no longer available');const permanent=playlist.tracks.includes(id),temporary=(S.temporaryAdds[playlist.id]||[]).includes(id),status=permanent?'Already added permanently':temporary?'Already added temporarily':'',permanentNote=playlist.storage==='temporary'?'Saves the song and keeps this playlist on this device permanently.':'Saved with this playlist after refresh and restart.';
 openDlg(`<h3>Add to ${esc(playlist.name)}</h3><p class="sub">${esc(t.title)}${status?` · ${status}`:''}</p>
 <button class="it" data-a="addperm" data-pl="${playlist.id}" data-id="${id}">${ic('plus')} <span><b>Permanent Add</b><br><span class="sub">${permanentNote}</span></span></button>
 <button class="it" data-a="addtemp" data-pl="${playlist.id}" data-id="${id}">${ic('plus')} <span><b>Temporary Add</b><br><span class="sub">Only for this page session; removed on refresh or when the session ends.</span></span></button>`)}
function nameForm(title,val,action,id){openDlg(`<form method="dialog" id="nf"><h3>${title}</h3><label class="sub" for="pn">Playlist name</label><input id="pn" maxlength="40" value="${esc(val)}" required style="margin:8px 0 14px">
 <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn g" onclick="dlg.close()">Cancel</button><button class="btn" style="margin-top:16px">Save</button></div></form>`);
 $('#pn').select();$('#nf').onsubmit=e=>{const n=$('#pn').value.trim();if(!n){e.preventDefault();return}action(n)}}
function playlistForm(val,action,initialSongId){openDlg(`<form method="dialog" id="plf"><h3>New playlist</h3><label class="sub" for="pn">Playlist name</label><input id="pn" maxlength="40" value="${esc(val)}" required style="margin:8px 0 14px">
 <span class="sub">Choose how long this playlist is kept</span>
 <label class="playlist-type"><input type="radio" name="playlistStorage" value="permanent" checked><span><b>Permanent Playlist</b><br><span class="sub">Saved on this device and available after refresh, restart, and future deployments.</span></span></label>
 <label class="playlist-type"><input type="radio" name="playlistStorage" value="temporary"><span><b>Temporary Playlist</b><br><span class="sub">Available in this browser tab until you close it.</span></span></label>
 ${initialSongId!=null?`<p class="sub" style="margin-top:14px">Add the selected song as</p><label class="playlist-type"><input type="radio" name="songStorage" value="permanent" checked><span><b>Permanent Add</b><br><span class="sub">Saves the song and keeps this playlist permanently if needed.</span></span></label><label class="playlist-type"><input type="radio" name="songStorage" value="temporary"><span><b>Temporary Add</b><br><span class="sub">Removed when this page is refreshed.</span></span></label>`:''}
 <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn g" onclick="dlg.close()">Cancel</button><button class="btn" style="margin-top:16px">Create playlist</button></div></form>`);
 $('#pn').select();$('#plf').onsubmit=e=>{const n=$('#pn').value.trim(),storage=$('input[name="playlistStorage"]:checked')?.value||'permanent',songStorage=$('input[name="songStorage"]:checked')?.value||'permanent';if(!n){e.preventDefault();return}action(n,storage,songStorage)}}
const uid=()=>'p'+Date.now().toString(36);
function addPlaylistSong(playlistId,id,kind){let p=S.playlists.find(x=>x.id===playlistId);if(!p||!T(id))return toast('This song or playlist is no longer available');const temporaryIds=S.temporaryAdds[playlistId]||[],wasTemporaryPlaylist=p.storage==='temporary';
 if(kind==='temporary'){
  if(p.tracks.includes(id))return toast('This song is already a permanent addition');if(temporaryIds.includes(id))return toast('This song is already a temporary addition');
  S.temporaryAdds[playlistId]=[...temporaryIds,id];
 }else{
  if(p.tracks.includes(id))return toast('This song is already permanent in this playlist');
  if(isCuratedPlaylist(playlistId)&&isCuratedSeed(playlistId,id)){S.temporaryAdds[playlistId]=temporaryIds.filter(trackId=>trackId!==id);return toast('This song is already part of the permanent curated selection')}
  S.temporaryAdds[playlistId]=temporaryIds.filter(trackId=>trackId!==id);
  if(wasTemporaryPlaylist)p.storage='permanent';
  if(isCuratedPlaylist(playlistId)){S.curatedTracks[playlistId]=validIds([...(S.curatedTracks[playlistId]||[]),id]);S.playlists=[...builtInPlaylists(S.curatedTracks,S.playlistDates),...S.playlists.filter(item=>!isPermanentPlaylist(item.id))];p=S.playlists.find(x=>x.id===playlistId)}else p.tracks=validIds([...p.tracks,id]);
 }
 persist();dlg.close();toast(`${kind==='temporary'?'Temporary':'Permanent'} add saved${kind==='permanent'&&wasTemporaryPlaylist?' · playlist saved permanently':''}`);route(true)
}

/* ---------- Actions ---------- */
const A={
 toggle:()=>P.toggle(),next:()=>P.next(),prev:()=>P.prev(),
 shuf:()=>{S.shuffle=!S.shuffle;syncPlayer()},rep:()=>{S.repeat=(S.repeat+1)%3;syncPlayer()},
 like:(e)=>toggleLike(+e.id),nav:e=>{location.hash=e.h},
 playctx:e=>{const ids=ctxIds(e.ctx);if(!ids.length)return toast('Nothing to play yet');P.playList(ids,+e.i)},
 shufctx:e=>{const ids=ctxIds(e.ctx);if(!ids.length)return toast('Nothing to play yet');S.shuffle=true;P.playList(ids,Math.random()*ids.length|0)},
 add:e=>addMenu(+e.id),enq:e=>{P.enqueue(+e.id);dlg.close();syncPlayer()},
 topl:e=>{const p=S.playlists.find(x=>x.id===e.pl),id=+e.id;if(!p)return toast('Playlist not found');if(p.id==='popular')return toast('Popular includes every available song');addSongOptions(p,id)},
 addperm:e=>addPlaylistSong(e.pl,+e.id,'permanent'),addtemp:e=>addPlaylistSong(e.pl,+e.id,'temporary'),
 newpl:e=>playlistForm('My playlist #'+(S.playlists.filter(p=>!isPermanentPlaylist(p.id)).length+1),(n,storage,songStorage)=>{const id=e.id!=null?+e.id:null,p={id:uid(),name:n,storage,createdAt:new Date().toISOString(),tracks:id!=null&&songStorage==='permanent'?validIds([id]):[]};if(id!=null&&songStorage==='permanent'&&p.storage==='temporary')p.storage='permanent';S.playlists.push(p);if(id!=null&&songStorage==='temporary')S.temporaryAdds[p.id]=[id];persist();toast(`${p.storage==='temporary'?'Temporary':'Permanent'} playlist created`);location.hash='#/playlist/'+p.id;route()},e.id),
 renpl:e=>{const p=S.playlists.find(x=>x.id===e.id);if(!p||isPermanentPlaylist(p.id))return toast('Permanent playlists cannot be renamed');nameForm('Rename playlist',p.name,n=>{p.name=n;persist();route(true)})},
 delpl:e=>{const p=S.playlists.find(x=>x.id===e.id);if(!p||isPermanentPlaylist(p.id))return toast('Permanent playlists cannot be deleted');openDlg(`<h3>Delete “${esc(p.name)}”?</h3><p class="sub">This can’t be undone.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn g" onclick="dlg.close()">Cancel</button><button class="btn" data-a="delok" data-id="${p.id}">Delete</button></div>`)},
 delok:e=>{if(isPermanentPlaylist(e.id))return toast('Permanent playlists cannot be deleted');S.playlists=S.playlists.filter(x=>x.id!==e.id);delete S.temporaryAdds[e.id];persist();dlg.close();toast('Playlist deleted');location.hash='#/library'},
 rmpl:e=>{const p=S.playlists.find(x=>x.id===e.pl),id=+e.id;if(!p)return;if(!(S.temporaryAdds[p.id]||[]).includes(id))return toast('Permanent playlist songs are protected');S.temporaryAdds[p.id]=S.temporaryAdds[p.id].filter(trackId=>trackId!==id);if(!S.temporaryAdds[p.id].length)delete S.temporaryAdds[p.id];persist();route(true)},
 rmq:e=>{const i=+e.i;S.queue.splice(i,1);if(i<S.qi)S.qi--;route(true)}};
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;ev.preventDefault();ev.stopPropagation();
 try{A[b.dataset.a](b.dataset)}catch(e){console.error(e);toast('Something went wrong. Try again.')}
 if(['playctx','shufctx'].includes(b.dataset.a))route(true)},true);
addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|TEXTAREA|BUTTON|A/.test(e.target.tagName)){e.preventDefault();P.toggle()}});
const _s=P.start.bind(P);P.start=function(){const pending=_s();route(true);return pending};
syncPlayer();route();

</script>
</body>
</html>
